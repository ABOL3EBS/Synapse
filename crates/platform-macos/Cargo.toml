[package]
name = "synapse-platform-macos"
version = "0.1.0"
edition = "2021"

[lib]
name = "synapse_platform_macos"
path = "src/lib.rs"

[[bin]]
name = "synapsed-helper"
path = "src/helper/main.rs"

[dependencies]
synapse-common = { path = "../common" }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
mach2 = "0.4"
libproc = "0.14"
serde = { version = "1", features = ["derive"] }
bincode = "1"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
