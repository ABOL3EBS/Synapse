[package]
name = "synapse-dashboard"
version = "0.1.0"
edition = "2021"

[lib]
name = "synapse_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "synapse-dashboard"
path = "src/main.rs"

# objc 0.2.7 macros emit #[cfg(feature = "cargo-clippy")] at our expansion
# sites; newer rustc check-cfg flags it as unexpected. Declare it expected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"
toml = "0.8"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
